[project]
name = "po-assist"
version = "0.1.0"
description = "Agent IA au service d'un Product Owner (test technique) : jeu de données Linear simulé et agent"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
